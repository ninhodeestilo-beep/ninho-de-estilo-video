name: Gerar vídeo de produto

on:
  workflow_dispatch:
    inputs:
      image_url:
        description: "URL da imagem do produto"
        required: true
        type: string
      item_id:
        description: "ID do produto"
        required: true
        default: "teste"
        type: string

  repository_dispatch:
    types:
      - render_product_video

permissions:
  contents: read

jobs:
  gerar-video:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      URL_DA_IMAGEM: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.image_url || inputs.image_url }}
      ITEM_ID: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.item_id || inputs.item_id }}
      URL_DE_RETORNO: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.callback_url || '' }}

    steps:
      - name: Set up job
        run: echo "Iniciando workflow..."

      - name: Preparar identificador
        id: preparar
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_URL="$(printf '%s' "${URL_DA_IMAGEM}" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          IMAGE_URL="$(printf '%s' "$IMAGE_URL" | sed 's/^"//;s/"$//')"
          IMAGE_URL="$(printf '%s' "$IMAGE_URL" | sed "s/^'//;s/'$//")"

          ITEM="$(printf '%s' "${ITEM_ID}" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          CALLBACK="$(printf '%s' "${URL_DE_RETORNO}" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"

          SAFE_ITEM="$(printf '%s' "$ITEM" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-zA-Z0-9._-]/-/g')"

          if [ -z "$SAFE_ITEM" ]; then
            SAFE_ITEM="produto"
          fi

          echo "IMAGE_URL=$IMAGE_URL" >> "$GITHUB_ENV"
          echo "ITEM=$ITEM" >> "$GITHUB_ENV"
          echo "SAFE_ITEM=$SAFE_ITEM" >> "$GITHUB_ENV"
          echo "CALLBACK=$CALLBACK" >> "$GITHUB_ENV"

          echo "safe_item=$SAFE_ITEM" >> "$GITHUB_OUTPUT"

          echo "URL final: $IMAGE_URL"
          echo "Item final: $ITEM"

      - name: Baixar imagem do produto
        shell: bash
        run: |
          set -euo pipefail

          echo "Baixando: $IMAGE_URL"

          curl -L --fail --retry 3 --retry-delay 2 \
            --user-agent "Mozilla/5.0" \
            "$IMAGE_URL" \
            --output produto.jpg

          test -s produto.jpg
          file produto.jpg || true

      - name: Verificar FFmpeg
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

          ffmpeg -version | head -n 1

      - name: Criar vídeo vertical
        shell: bash
        run: |
          set -euo pipefail

          ffmpeg -y \
            -loop 1 -i produto.jpg \
            -f lavfi -i anullsrc=channel_layout=stereo:sample_rate=44100 \
            -vf "scale=1080:1920:force_original_aspect_ratio=decrease,pad=1080:1920:(ow-iw)/2:(oh-ih)/2,setsar=1,format=yuv420p" \
            -r 30 \
            -t 8 \
            -c:v libx264 \
            -pix_fmt yuv420p \
            -c:a aac \
            -shortest \
            "video-${SAFE_ITEM}.mp4"

          test -s "video-${SAFE_ITEM}.mp4"

      - name: Guardar vídeo de teste
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ steps.preparar.outputs.safe_item }}
          path: video-${{ steps.preparar.outputs.safe_item }}.mp4
          if-no-files-found: error

      - name: Enviar vídeo ao n8n
        if: ${{ env.CALLBACK != '' }}
        shell: bash
        run: |
          set -euo pipefail

          curl -L --fail \
            -X POST "$CALLBACK" \
            -F "item_id=$ITEM" \
            -F "status=sucesso" \
            -F "arquivo=@video-${SAFE_ITEM}.mp4;type=video/mp4"

      - name: Complete job
        run: echo "Workflow concluído com sucesso."
